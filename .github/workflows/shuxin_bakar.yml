name: Build Shuxin AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev openjdk-17-jdk shared-mime-info libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev ccache
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE: "y"
        # Kosongkan paksa variabel NDK bawaan server agar Buildozer mendownload r25c sendiri
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK: ""

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shuxin-ai-apk
        path: bin/*.apk
