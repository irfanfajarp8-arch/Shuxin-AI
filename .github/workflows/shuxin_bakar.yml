name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libffi-dev \
            libssl-dev \
            lib32stdc++6 \
            libsqlite3-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ccache \
            gettext

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip --break-system-packages
          pip install virtualenv "cython>=3.0.0" --break-system-packages
          pip install buildozer --break-system-packages

      - name: Build APK with Buildozer
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: y
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-APK
          path: ./.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/*/build/outputs/apk/debug/*.apk
