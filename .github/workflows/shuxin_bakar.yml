name: Build Shuxin AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev openjdk-17-jdk shared-mime-info libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev ccache
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Build APK with Buildozer
      run: |
        # Ambil dan pasang Android NDK r25c secara bersih agar tidak memakai r27 bawaan server
        wget https://google.com
        unzip -q android-ndk-r25c-linux.zip -d ~/.buildozer
        
        # Jalankan kompilasi debug
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE: "y"
        ANDROID_NDK_HOME: "/home/runner/.buildozer/android-ndk-r25c"
        ANDROID_NDK: "/home/runner/.buildozer/android-ndk-r25c"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shuxin-ai-apk
        path: bin/*.apk
