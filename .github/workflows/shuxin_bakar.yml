name: Build APK Shuxin AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python Stabil
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Platform Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip libssl-dev build-essential ccache libffi-dev aidl libtool autoconf automake

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip --break-system-packages
        pip install cython virtualenv --break-system-packages
        pip install buildozer --break-system-packages

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_NET: y
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Shuxin-AI-APK
        path: bin/*.apk
