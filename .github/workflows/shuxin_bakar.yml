    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer Master and Dependencies
        run: |
          pip install --upgrade pip --break-system-packages
          pip install virtualenv --break-system-packages
          pip install git+https://github.com --break-system-packages

      - name: Build APK with Buildozer
        run: |
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: y
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-APK
          path: ./.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/*/build/outputs/apk/debug/*.apk
